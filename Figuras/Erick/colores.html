<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azoreh - 3D por Capas (Profundidad)</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #4a4a4a; /* Fondo gris de tu imagen */
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: sans-serif;
            perspective: 1200px; /* Aumenta la sensación de profundidad */
        }

        #scene {
            width: 350px;
            height: 350px;
            position: relative;
            transform-style: preserve-3d;
            cursor: grab;
            /* Transición suave para cuando se suelta el ratón */
            transition: transform 0.2s ease-out; 
        }

        #scene:active {
            cursor: grabbing;
        }

        .character {
            width: 100%;
            height: 100%;
            position: absolute;
            transform-style: preserve-3d;
            /* Centramos el personaje en el espacio 3D */
            left: 50%;
            top: 50%;
            margin-left: -175px;
            margin-top: -175px;
        }

        /* --- ESTILOS DE LAS CARAS / CAPAS 3D --- */
        /* Todos los elementos hijos heredan el 3D */
        .layer {
            position: absolute;
            left: 50%;
            top: 50%;
            transform-style: preserve-3d;
            /* Borde oscuro estilo dibujo */
            border: 3px solid #2a2a2a;
            box-shadow: inset -15px -15px 0px rgba(0,0,0,0.15); /* Sombra para dar volumen */
            box-sizing: border-box;
        }

        /* 1. La Capa / Túnica (Fondo) */
        .cape {
            width: 200px;
            height: 220px;
            background-color: #e8dcc8; /* Blanco roto */
            border-radius: 40% 40% 20% 20%;
            margin-left: -100px;
            margin-top: -80px;
            /* Profundidad trasera */
            transform: translateZ(-20px);
            /* Recorte para dar forma de flecos abajo */
            clip-path: polygon(15% 0, 85% 0, 100% 100%, 80% 90%, 60% 100%, 40% 90%, 20% 100%, 0% 100%);
        }

        /* 2. La Cabeza / Máscara (Centro) */
        .mask {
            width: 130px;
            height: 160px;
            background-color: #c2a47c; /* Color base marrón claro */
            border-radius: 45% 45% 35% 35%;
            margin-left: -65px;
            margin-top: -120px;
            /* Profundidad media */
            transform: translateZ(10px);
        }

        /* Detalles de la máscara (Ojos y boca) pintados con gradientes */
        .mask::before {
            content: '';
            position: absolute;
            top: 40px;
            left: 15px;
            width: 100px;
            height: 50px;
            background: #1a1a1a;
            /* Forma de ojos rasgados */
            clip-path: polygon(0% 30%, 30% 10%, 50% 40%, 70% 10%, 100% 30%, 80% 80%, 50% 50%, 20% 80%);
        }

        /* 3. Cuernos (Adelante y laterales) */
        .horn {
            width: 25px;
            height: 100px;
            background-color: #a8c9b8; /* Color verde menta */
            border-radius: 50% 50% 10% 10%;
            position: absolute;
            top: -80px;
            /* Profundidad delantera */
            transform: translateZ(20px); 
        }
        .horn.left {
            left: 20px;
            transform: translateZ(20px) rotate(-25deg);
        }
        .horn.right {
            right: 20px;
            transform: translateZ(20px) rotate(25deg);
        }

        /* 4. El Hacha (Delante del todo) */
        .axe-head {
            width: 70px;
            height: 40px;
            background-color: #9ca3a8; /* Gris metálico */
            border-radius: 10% 50% 50% 10%;
            position: absolute;
            bottom: 30px;
            right: -20px;
            /* La máxima profundidad hacia el espectador */
            transform: translateZ(40px) rotate(-15deg);
        }
        .axe-handle {
            width: 12px;
            height: 100px;
            background-color: #5a3d2b; /* Madera */
            position: absolute;
            bottom: -20px;
            right: 10px;
            transform: translateZ(35px) rotate(-15deg);
            border-radius: 5px;
        }

        /* Colmillos / Dientes (Detalle frontal) */
        .fang {
            width: 10px;
            height: 20px;
            background-color: #a8c9b8;
            clip-path: polygon(50% 0, 100% 100%, 0 100%);
            position: absolute;
            bottom: -15px;
            transform: translateZ(15px);
        }
        .fang:nth-child(1) { left: 30px; }
        .fang:nth-child(2) { right: 30px; }

        /* --- INTERFAZ DE USUARIO --- */
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #a8c9b8;
            background: rgba(0,0,0,0.7);
            padding: 15px;
            border-radius: 8px;
            border: 2px solid #2a2a2a;
            pointer-events: none;
            z-index: 1000;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div id="ui">
        <h3 style="margin-top:0; color:#c2a47c;">Azoreh 3D</h3>
        <p style="margin: 5px 0;">🖱️ <b>Arrastra</b> para rotar.</p>
        <p style="margin: 5px 0;">⌨️ Usa <b>Flechas</b> (← ↑ ↓ →).</p>
        <p style="margin: 5px 0;">Eje X: <span id="rot-x">0</span>°</p>
        <p style="margin: 5px 0;">Eje Y: <span id="rot-y">0</span>°</p>
    </div>

    <div id="scene">
        <div class="character">
            <!-- Las capas se apilan en el eje Z (profundidad) -->
            <div class="layer cape"></div>
            
            <!-- Detalles de la cabeza agrupados -->
            <div class="layer mask"></div>
            <div class="layer horn left"></div>
            <div class="layer horn right"></div>
            
            <!-- Colmillos -->
            <div class="layer fang" style="left: 95px; bottom: 20px; margin-left:-5px;"></div>
            <div class="layer fang" style="left: 145px; bottom: 20px; margin-left:-5px;"></div>

            <!-- Arma -->
            <div class="layer axe-handle"></div>
            <div class="layer axe-head"></div>
        </div>
    </div>

    <script>
        const scene = document.getElementById('scene');
        const rotXLabel = document.getElementById('rot-x');
        const rotYLabel = document.getElementById('rot-y');

        let rotX = -10; // Inclinación inicial leve
        let rotY = 25;  // Giro inicial leve

        // --- LÓGICA DE MATRICES DE ROTACIÓN ---
        // Aplicamos la rotación usando transformaciones CSS 3D.
        // Internamente, el navegador calcula las matrices de Euler y el orden Z-index automáticamente.
        function updateRotation() {
            scene.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`;
            rotXLabel.textContent = Math.round(rotX);
            rotYLabel.textContent = Math.round(rotY);
        }

        // --- CONTROL POR RATÓN ---
        let isDragging = false;
        let prevMouse = { x: 0, y: 0 };

        scene.addEventListener('mousedown', (e) => {
            isDragging = true;
            prevMouse = { x: e.clientX, y: e.clientY };
            scene.style.transition = 'none'; // Respuesta inmediata al arrastrar
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;

            const deltaX = e.clientX - prevMouse.x;
            const deltaY = e.clientY - prevMouse.y;
            const sensibilidad = 0.5;

            rotY += deltaX * sensibilidad;
            rotX -= deltaY * sensibilidad;

            // Límite para no dar volteretas (opcional)
            // rotX = Math.max(-90, Math.min(90, rotX));

            updateRotation();
            prevMouse = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
            scene.style.transition = 'transform 0.3s cubic-bezier(0.25, 1, 0.5, 1)'; // Inercia
        });

        // --- CONTROL POR TECLADO ---
        const step = 5;
        window.addEventListener('keydown', (e) => {
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
                e.preventDefault(); // Evitar scroll de la página
                scene.style.transition = 'transform 0.1s linear';

                if (e.key === 'ArrowUp') rotX -= step;
                if (e.key === 'ArrowDown') rotX += step;
                if (e.key === 'ArrowLeft') rotY -= step;
                if (e.key === 'ArrowRight') rotY += step;

                updateRotation();
            }
        });

        // Inicializar posición
        updateRotation();

    </script>
</body>
</html>
